name: secret-scan

# 开源仓库的最后一道防线：每次 push / PR 都扫一遍密钥。
# 本地有 scripts/check_secrets.sh 可以装成 pre-commit 钩子，这里是不依赖
# 开发者自觉的 CI 侧兜底。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks 需要完整历史才能扫历史提交

      # ======================================================================
      #  第 1 步：项目自己的扫描器 —— 这才是主闸门
      # ======================================================================
      #
      # ⚠️ 顺序是有讲究的：必须在 gitleaks **之前**。
      #    GitHub Actions 一旦某一步失败就中止后续步骤 —— 如果 gitleaks 排前面，
      #    它报一个假阳性就会让真正的主闸门**根本不运行**。
      #    检查的排列顺序本身就是一种设计决策，别随手调。
      #
      # 为什么它才是主闸门：实测注入 7 类本项目的真实密钥，
      #      check_secrets.sh  7/7 命中
      #      gitleaks          1/7 命中（只有 PEM 私钥）
      #    漏检的是 Bot Token / OCI OCID / API 指纹 / S3 AccessKey / 私钥路径。
      #    原因：gitleaks 的默认规则集按「通用密钥形态」设计，不认识
      #    `ocid1.` 这种厂商特有前缀，也不认识 Telegram 的 `<数字>:<35位>` 形态。
      #    → **不能把开源安全托付给第三方扫描器。**
      #
      # 先自检再扫描：一个「匹配不到任何东西」的扫描器比没有扫描器更危险 ——
      # 它给你虚假的安全感。这个项目已经栽过两次：
      #   · 正则里用了 `\b`，macOS BSD grep 在 ERE 下不支持 → 静默失效
      #   · 白名单里放了 `aaaa`，而真实 OCID 随机段都以 aaaa 开头 → OCID 检查报废
      # 所以先证明每条规则真的能命中它该命中的东西，再去扫真实文件。
      - name: 规则自检（每条规则都必须能命中目标样本）
        run: bash scripts/check_secrets.sh --verify

      # ⚠️ 这里**直接调用仓库里的脚本**，不复制一份规则到 YAML 里。
      #    之前 CI 内联了一份规则表，结果和本地版本漂移了：
      #    CI 的白名单残留着 `aaaa`（OCID 检查形同虚设），规则也比本地少 2 条。
      #    同一份检查有两处实现，就一定会分叉。扫描器是唯一事实来源。
      #
      #    用 `bash` 显式调用而不是 `./`，这样即使 exec 位在某个平台上丢了也能跑。
      - name: 扫描 OCI / Telegram 凭据特征
        run: bash scripts/check_secrets.sh

      # ======================================================================
      #  第 1.5 步：开源审计 —— 扫描器之外的那一半
      # ======================================================================
      #
      # check_secrets.sh 只回答「有没有密钥形态的字符串」。它不回答：
      #   · 有没有**已经跟踪**了本该忽略的文件（.pem / accounts.json / *.env）
      #   · .gitignore 的规则是不是**真的**兜得住（读文本没用，要实测）
      #   · 文档里有没有真实的 OCID / 公网 IP / 个人邮箱 —— 这些不是密钥，
      #     但一样是「不该出现在公开仓库里的东西」
      #   · 仓库里是不是混进了不该发布的目录（backups/、日志、__pycache__）
      #
      # 和主闸门一样**必须排在 gitleaks 之前**：它是我们自己的检查，
      # 不能被第三方扫描器的假阳性挤掉。理由见上面第 1 步的注释。
      #
      # 与 check_secrets.sh 的关系是**互补而不是重复**：一个查「密钥形态」，
      # 一个查「发布面」。两边都要绿才能推。
      #
      # 同样先自检再扫描：注入 12 类合成串，**每条都必须命中对得上号的那条规则**
      # （只判「非 0 退出」不够 —— 那会让「规则串了」这种错漏过去）。
      # 探针写在临时目录里，靠 `--probe-file=` 送进去，**不碰 git 索引**。
      - name: 开源审计 · 规则自检（注入 12 类合成串）
        run: python3 scripts/audit_open_source.py --verify

      - name: 开源审计（跟踪文件 / .gitignore 覆盖 / 真实标识）
        run: python3 scripts/audit_open_source.py

      # ======================================================================
      #  第 2 步：gitleaks —— 补充网，不是主闸门
      # ======================================================================
      #
      # 只作为兜底：能多抓一类就多一层。**覆盖不到本项目的主威胁模型**（见上）。
      #
      # 配置在仓库根目录的 .gitleaks.toml：用来**精确豁免**测试夹具里那些
      # 必须长得像真密钥的字符串。仓库自己的 `secret-scan:allow` 行内标记
      # gitleaks 不认识 —— 不翻译过去的话，CI 每次都会因为测试夹具报红，
      # 而**一个红久了的检查等于没有检查**，大家会开始无脑忽略它。
      #
      # 显式指定配置文件，不依赖 gitleaks-action 的自动发现行为。
      - name: gitleaks（补充网）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 单元测试
        run: pytest tests/ -v
