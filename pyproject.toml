[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracles"
version = "0.1.0"
description = "用 Telegram Bot 管理多个 Oracle Cloud (OCI) 账号，基于 Oracle 官方 Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["oracle", "oci", "telegram", "bot", "always-free", "cloud", "oracle-cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "oci>=2.120.0",
    "python-telegram-bot>=21.0",
    # 现场生成救援控制台的临时 RSA 密钥对（oci 间接也会装，但我们直接 import）
    "cryptography>=42.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34.0"]
dev = ["pytest>=8.0", "ruff>=0.5.0", "PyYAML>=6.0"]

[project.scripts]
# 运维 CLI（只读）
oracles = "oracles.cli:main"
# Telegram Bot
oracles-bot = "oracles.bot.app:main"

[tool.setuptools.packages.find]
include = ["oracles*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
