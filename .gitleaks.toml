# ============================================================================
#  gitleaks 配置 —— 把「本仓库已判定为虚构」的内容翻译给 gitleaks
#
#  为什么需要这个文件：
#      CI 里跑的是 gitleaks（规则由上游维护），它**不认识**本仓库自己的
#      `secret-scan:allow` 注释。而仓库里必然有若干测试夹具要长得像真密钥
#      —— 否则没法验证脱敏功能本身 —— 于是 gitleaks 每次都会报，CI 每次都红。
#      **一个红久了的检查等于没有检查**，大家会开始无脑忽略它。
#
#  这个文件的作用是**精确豁免**，不是放宽规则：
#      · 只豁免带 `secret-scan:allow` 标记的**那一行**（与本地脚本同一个约定）
#      · 只整份跳过两个「自己扫自己必然全红」的文件
#      · 不添加任何通用 allowlist —— 尤其**不能**放行 `EXAMPLE` / `example`
#        之类的词。真实凭据里完全可能带这些字样，放行就等于给泄露开口子。
#
#  ⚠️ 改这个文件后必须验证它没有把自己变成橡皮图章：
#      往任意源码文件里塞一个**形态真实**的密钥，确认扫描会红。
#      做法见 docs/06-踩坑清单.md 的「让检查失效的元坑」一节。
#      ⚠️ 探针要选 gitleaks **真的认**的形态。第一版用了 Telegram bot token
#         的形态，结果「不带配置也不报红」—— 因为 gitleaks 默认规则压根
#         不认识这个厂商形态（本项目实测它只覆盖 1/7 类凭据）。
#         一个不会被拦的探针，看起来通过，其实什么都没验证。
#
#  ⚠️ 这里的 paths 清单和 scripts/check_secrets.sh 里的 SKIP_FILES 是
#      **同一个意图的两处表达**（一个管 gitleaks，一个管本地脚本）。
#      改一处记得改另一处。
# ============================================================================

[extend]
# 继承 gitleaks 默认规则集，只在其上做精确豁免。
useDefault = true


# ---------------------------------------------------------------------------
#  唯一的全局豁免表
# ---------------------------------------------------------------------------
#
# 🔴 **必须是单数 `[allowlist]`，不能写成复数的 `[[allowlists]]`。**
#
#    CI 里 gitleaks-action@v2 固定装的是 **gitleaks 8.24.3**（日志里写死的）。
#    实测：**同一个配置文件**，8.24.3 报 3 个 finding，本地 8.30.1 报 0 个。
#    原因是 8.24.3 **静默忽略**复数的 `[[allowlists]]`：配置照常加载、
#    不报错、不警告，日志里还写着 `using gitleaks config from ...`，
#    但豁免一条都不生效 —— 正是本项目最忌讳的那类失效（看起来在跑，实际没生效）。
#
#    代价：8.24.3 只支持**一个**全局豁免表，所以下面把原来分开写的
#    「按路径整份跳过」和「按行内标记跳过」合并进同一个表 ——
#    gitleaks 对同一表内的条件取「或」，合并后语义与原来等价。
#
#    复现 / 回归命令（两个版本都要跑，判据必须一致）：
#      gitleaks detect --config .gitleaks.toml --redact -v --exit-code=2 --log-opts=-1
#      # 8.24.3 → no leaks found ；8.30.1 → no leaks found
#
# ---------------------------------------------------------------------------
#  条件 1：整份跳过「自己扫自己必然全红」的文件
# ---------------------------------------------------------------------------
# 这两个文件按定义就包含一堆看起来像密钥的正则和样本。
# 它们的正确性由 `scripts/check_secrets.sh --verify` 保证，不是由自扫保证。
#
# __pycache__ 是 Python 编译产物：CI 里 actions/checkout 不会带来它，
# 但本地扫描会 —— .pyc 里嵌着源码字符串，会报出重复的假命中。
# **假警报比漏检更会害死人，因为它训练你忽略输出。**
#
# ---------------------------------------------------------------------------
#  条件 2：行内标记（与 scripts/check_secrets.sh 的 ALLOW_MARKER 同一个字符串）
# ---------------------------------------------------------------------------
# 测试夹具和文档示例里**必须**出现 OCID / PEM / Token 这类字符串，
# 否则没法验证脱敏功能本身。这类行加注释即可跳过。
#
# regexTarget = "line" 表示「在命中所在的那一行里找这个标记」，
# 而不是只看命中片段本身 —— 标记通常是行尾注释。
[allowlist]
description = "扫描器自身 / 编译产物 / 行内标记 secret-scan:allow"
paths = [
  '''^scripts/check_secrets\.sh$''',
  '''^\.github/workflows/secret-scan\.yml$''',
  '''__pycache__/''',
]
regexTarget = "line"
regexes = ['''secret-scan:allow''']
